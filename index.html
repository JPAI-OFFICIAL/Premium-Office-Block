<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOME OFFICE SHOP - Link Hub</title>
<style>
  body{margin:0;background:#0A1931;font-family:Prompt,sans-serif}
  .hero{position:relative;width:100%;max-width:1200px;margin:0 auto}
  .hero img{width:100%;display:block}
  .btn-shop{
    position:absolute;
    left:13%;
    bottom:14%;
    width:22%;
    height:6%;
    display:flex;align-items:center;justify-content:center;
    background:#E8D5A3;color:#0A1931;
    border-radius:50px;
    text-decoration:none;
    font-weight:700;
    font-size:14px;
  }
  .btn-wholesale{
    position:absolute;
    right:13%;
    bottom:14%;
    width:22%;
    height:6%;
    display:flex;align-items:center;justify-content:center;
    background:#E8D5A3;color:#0A1931;
    border-radius:50px;
    text-decoration:none;
    font-weight:700;
    font-size:14px;
  }
  /* บนมือถือปรับตำแหน่งปุ่ม */
  @media(max-width:768px){
    .btn-shop{left:15%;bottom:11%;width:28%;font-size:11px}
    .btn-wholesale{right:15%;bottom:11%;width:32%;font-size:11px}
  }
</style>
</head>
<body>

<div class="hero">
  <!-- ใช้ภาพที่พี่ส่งมา -->
  <img src="images/home-office-shop-hub.jpg" alt="HOME OFFICE SHOP Link Hub">
  
  <!-- ปุ่ม SHOP กดไป shop.homeofficeshop.com -->
  <a href="https://shop.homeofficeshop.com" target="_blank" class="btn-shop">VISIT SHOP →</a>
  
  <!-- ปุ่ม WHOLESALE กดไป wholesale.homeofficeshop.com -->
  <a href="https://wholesale.homeofficeshop.com" target="_blank" class="btn-wholesale">VISIT WHOLESALE →</a>
</div>

</body>
</html>
